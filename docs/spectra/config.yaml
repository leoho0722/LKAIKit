schema: spec-driven

context: |
  專案定位：LKAIKit 是專供 Leo Ho 個人專案使用的 AI 服務套件，整合多家 AI 服務供應商（例如 OpenAI GPT、Anthropic Claude、Google Gemini）。
  技術棧：Swift 6，以 Swift Package 發佈。
  支援平台：iOS 26.0+、macOS 26.0+。
  命名前綴：本專案固定使用 `LK` 作為前綴字（例如 LKAIKit）。
  命名規則：
    - 模組名稱為 `LKAI<名稱>`，例如 LKAICore、LKAIKit、LKAIOpenAI。
    - source target 的頂層型別：非供應商 target（LKAICore、LKAIKit、LKAIKitCLI、LKAITestSupport）用 `LKAI<名稱>`；供應商 target 用 `LK<供應商><名稱>`，例如 LKOpenAIClient。
    - 巢狀型別與測試 target 的型別不受前綴規則限制；測試型別跟隨受測型別命名，沒有受測型別時跟隨來源檔命名（例如 ExportsTests 對應 Exports.swift）。
    - 型別不得與任何模組同名。
    - 不在 public 層級擴充非本 package 的型別（例如 Data、String、URLRequest）；package 層級的這類擴充只允許寫在 LKAICore。
    - 不宣告 public 或 package 層級的頂層函式。
    - 非本 package 的型別遵循本 package 的 `public` protocol，只能寫在 LKAICore。
  API 演進規則：
    - 公開 enum 預期會新增 case 時標 `@nonexhaustive`，App 的 switch 必須寫 `@unknown default`；在非 resilient 模組日後再加是 API 破壞性變更，拿掉則不會。
    - 公開 struct 之後新增欄位時，`public init` 的新參數一律給預設值，讓 App 建立這些值的程式碼（例如測試替身）不必修改。
    - 供應商的 change 不得為了自己的格式修改 LKAICore 的共用公開型別；需要修改時另開 change 修改 `chat-client` spec。
    - 新增供應商的 change 開始前，先讀 add-chat-abstraction-anthropic 封存後的 design：逐列核對 Context 的三家對照表，並處理 Open Questions 留給下一家供應商的項目。
  使用方式：
    - library：主要供 iOS App 專案整合使用，例如 BuyLedger。
    - executableTarget：主要供 CI/CD 使用，不用於 App 專案。

rules:
  proposal:
    - 請使用正體中文進行撰寫
  design:
    - 請使用正體中文進行撰寫
    - 請將長期架構維護列為每次提案設計的優先考量
  specs:
    - 使用 Given/When/Then 格式：每個 `#### Scenario:` 依序以 `- **GIVEN**`（前置條件）、`- **WHEN**`（觸發動作）、`- **THEN**`（預期結果）撰寫，額外的條件或結果以 `- **AND**` 接續
  tasks:
    - 請使用正體中文進行撰寫
